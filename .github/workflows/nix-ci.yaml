name: Nix Configuration CI

on:
  push:
  pull_request:
    branches: ["master"]

jobs:
  test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-platforms = aarch64-linux

      - name: Check syntax and inputs (Flake Check)
        run: nix flake check

      - name: Run localLib Unit Tests
        run: nix eval --raw --file lib/tests/default.nix

      - name: Evaluate testWayland (Dry Run)
        run: nix build .#nixosConfigurations.testWayland.config.system.build.toplevel --dry-run

      - name: Evaluate testX11 (Dry Run)
        run: nix build .#nixosConfigurations.testX11.config.system.build.toplevel --dry-run

      - name: Evaluate testHome (Dry Run)
        run: nix build .#homeConfigurations.testHome.activationPackage --dry-run

      - name: Evaluate testDroid (Dry Run)
        run: nix build .#nixOnDroidConfigurations.testDroid.activationPackage --dry-run --impure --extra-substituters "https://nix-on-droid.cachix.org" --extra-trusted-public-keys "nix-on-droid.cachix.org-1:56snoO8c9x5fH9L/iW31E1vH7c1Gus4uRk6o8f+d60U="


  test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate testMac (Standalone macOS)
        run: nix build .#homeConfigurations.testMac.activationPackage --dry-run
