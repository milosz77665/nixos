name: Nix Configuration CI

on:
  push:
  pull_request:
    branches: ["master"]

jobs:
  checks:
    name: Eval, structure and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate flake checks
        run: nix flake check --no-build

      - name: Run localLib unit tests
        run: nix eval --raw --file lib/tests/default.nix

      - name: Check formatting
        run: nix fmt -- --check

      - name: Ensure only test hosts are present
        run: |
          test "$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" = '["testWayland","testX11"]'
          test "$(nix eval --json .#homeConfigurations --apply builtins.attrNames)" = '["testHome","testMac"]'
          test "$(nix eval --json .#nixOnDroidConfigurations --apply builtins.attrNames)" = '["testDroid"]'

  nixos:
    name: NixOS ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [testWayland, testX11]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build ${{ matrix.host }}
        run: nix build --no-link .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate testMac (Standalone macOS)
        run: nix build .#homeConfigurations.testMac.activationPackage --dry-run
